services:
  falkordb:
    image: falkordb/falkordb@sha256:b0bdcac2cbaff989e77cb0610439b7a9289e86de033ccbbd4368b66fb680ae7a
    container_name: chronos_falkordb
    ports:
      - "127.0.0.1:6379:6379"
      - "127.0.0.1:3000:3000"
    volumes:
      - falkordb_data:/var/lib/falkordb/data
    # Redis append-only persistence is needed for import receipts across DB restarts.
    environment:
      REDIS_ARGS: "--appendonly yes"
    restart: unless-stopped

volumes:
  falkordb_data:
