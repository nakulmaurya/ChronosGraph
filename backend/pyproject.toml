[project]
name = "chronosgraph-backend"
version = "0.1.0"
description = "ChronosGraph: Speculative GRAPH.COPY PR Sandbox, Bi-Temporal Contradiction Shield & shortestPath JIT Playbook Compiler on FalkorDB"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "falkordb>=1.0.8",
    "fastmcp>=0.4.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "numpy>=1.26.0",
    "pytest>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
