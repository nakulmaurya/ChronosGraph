name: Command center correctness
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
  native-command-center:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: backend
      FALKORDB_HOST: 127.0.0.1
      FALKORDB_PORT: '6379'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-linux-py313.lock
      - run: |
          python -m pip install --require-hashes -r backend/requirements-linux-py313.lock
          python -m pip install --no-deps -e backend
          python -m pip check
      - name: Start isolated native FalkorDB
        run: |
          docker run --detach --name chronos-ci -e BROWSER=0 -p 127.0.0.1:6379:6379 falkordb/falkordb@sha256:b0bdcac2cbaff989e77cb0610439b7a9289e86de033ccbbd4368b66fb680ae7a
          python - <<'PY'
          import time
          from redis import Redis
          r=Redis(host='127.0.0.1',port=6379)
          for _ in range(60):
              try:r.execute_command('GRAPH.LIST');break
              except Exception:time.sleep(.5)
          else:raise SystemExit('Native FalkorDB unavailable')
          PY
      - name: Native inventory, history and durable import regressions
        run: python -m pytest backend/tests/test_bulk_navigation.py backend/tests/test_command_center.py backend/tests/test_import_jobs.py backend/tests/test_change_lifecycle.py -v
      - name: Known-answer workflow, source accuracy and stale-memory regressions
        run: python -m pytest backend/tests/test_workflow_benchmarks.py -k 'known_answer or recovery_active_only or metric_edge_cases or owned_graph' -v
      - name: Post-review source, classification and active-policy regressions
        run: python -m pytest backend/tests/test_post_review_correctness.py backend/tests/test_context_memory.py backend/tests/test_organization_evidence.py backend/tests/test_memory_carryforward.py backend/tests/test_release_identity.py backend/tests/test_copy_retry.py -v
      - name: Crash recovery of receipt and graph
        run: PYTHON_BIN=$(command -v python) bash scripts/verify-database-persistence.sh
      - name: Cleanup owned service
        if: always()
        run: docker rm -f chronos-ci || true
